    <script>
      (function(){
        var isMobile = window.innerWidth <= 768;
        if(!isMobile) return;
        var count = 0;
        function startCount(){
          count++;
          var counterEl = document.querySelector('.loading-content span');
          var ls = document.querySelector('.loading-screen');
          var btn = document.querySelector('.loading-wrap');
          if(counterEl) counterEl.textContent = count + '%';
          if(count < 100){
            setTimeout(startCount, 40 + Math.random()*60);
          } else {
            if(btn) btn.classList.add('loading-clicked');
            if(ls){
              ls.style.transition = 'opacity 0.8s ease-out';
              ls.style.opacity = '0';
              setTimeout(function(){
                ls.style.display = 'none';
                document.body.style.overflowY = 'auto';
                document.body.style.overflow = 'auto';
                var m = document.querySelector('main');
                if(m) m.classList.add('main-active');
                document.body.style.backgroundColor = '#0b080c';
              }, 800);
            }
          }
        }
        setTimeout(startCount, 300);
      })();
    </script>
